name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            jax-pin: "jax==0.5.3"   # the tested floor (pyproject's jax>=)
            extras: "gen,test"      # pytensor>=3.2 needs python>=3.12
          - python-version: "3.13"
            jax-pin: "jax"          # latest resolution
            extras: "gen,test,pytensor,numpyro"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e ".[${{ matrix.extras }}]"
          python -m pip install "${{ matrix.jax-pin }}"
      - name: Run suite (the slow tests run once, in the slow job)
        # two workers, not four: four peaked at 15.5 GB together, and the
        # runner has 16
        run: python -m pytest -q -m "not slow" -n 2

  slow:
    # the slow-marked tests: byte-for-byte table regeneration and an mpmath
    # fit sweep. The generators use mpmath and numpy, not jax, so one job
    # covers every jax version, and it runs beside the matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[gen,test]"
      - name: Slow tests
        run: python -m pytest -q -m slow -n auto

  x64-off:
    # the default jax configuration (float32). The main suite forces x64 on
    # in conftest, so without this job the configuration most users get is
    # never tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[gen,test,numpyro]"
      - name: Default runtime (x64 off)
        run: python -m pytest -q tests/test_x64_off.py
      - name: Per-recipe x64-off checks
        run: python -m pytest -q -k "x64_off or float32" tests/

  no-extras:
    # a plain `pip install .`, which is what users get: no extras, and not
    # editable, so it runs on what the wheel ships. Every other job
    # installs gen,test, so mpmath is never really absent there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install . pytest
      - name: Import without extras
        run: python -m pytest -q tests/test_extras.py

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[gen,test,examples]"
          python -m pip install nbconvert ipykernel
      - name: Execute every notebook
        run: |
          set -e
          for nb in notebooks/0*.ipynb; do
            echo "== $nb"
            JAX_PLATFORMS=cpu timeout 1500 python -m nbconvert \
              --to notebook --execute --stdout "$nb" > /dev/null
          done
