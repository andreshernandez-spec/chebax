[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chebax"
version = "0.3.0"
description = "Differentiable Chebyshev approximants for special functions, aimed at JAX and GPUs"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Andres Hernandez", email = "andres.hernandez.deml@gmail.com" }]
requires-python = ">=3.11"
# jax floor = the oldest version the full suite passes on (CI pins a job to it)
dependencies = ["jax>=0.5.3", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/andreshernandez-spec/chebax"

[project.optional-dependencies]
# tables record the mpmath version that built them; regeneration is verified
# byte for byte, so the build dependency is pinned to the recorded minor
gen = ["mpmath>=1.4.1,<1.5"]
test = ["pytest", "pytest-xdist", "scipy"]
examples = ["matplotlib", "numpyro"]
numpyro = ["numpyro>=0.15"]
pytensor = ["pytensor>=3.2"]
lint = ["black==26.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: table regeneration and other multi-minute tests",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
# Generated tables follow _gen_common.write_table_module and are never edited
# by hand; experiments are re-run whenever their source changes, and the
# notebooks are executed outputs. Generators are formatted, which changes
# their recorded source hash: regenerate their tables in the same change.
extend-exclude = '^/(src/chebax/_src/recipes/\w+_table(_ext)?\.py|experiments/|notebooks/)'
