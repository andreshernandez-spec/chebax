[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chebax"
version = "0.1.0.dev0"
description = "Differentiable Chebyshev approximants for special functions, aimed at JAX and GPUs"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Andres Hernandez", email = "andres.hernandez.deml@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["jax>=0.4.30", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/andreshernandez-spec/chebax"

[project.optional-dependencies]
gen = ["mpmath>=1.3"]
test = ["pytest"]
examples = ["matplotlib", "numpyro"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: table regeneration and other multi-minute tests",
]
