name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            jax-pin: "jax==0.5.3"   # the tested floor (pyproject's jax>=)
            extras: "gen,test"      # pytensor>=3.2 needs python>=3.12
          - python-version: "3.13"
            jax-pin: "jax"          # latest resolution
            extras: "gen,test,pytensor,numpyro"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e ".[${{ matrix.extras }}]"
          python -m pip install "${{ matrix.jax-pin }}"
      - name: Run full suite (includes byte-for-byte table regeneration)
        run: python -m pytest -q

  x64-off:
    # the default jax configuration (float32). The main suite forces x64 on
    # in conftest, so without this job the configuration most users get is
    # never tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[gen,test,numpyro]"
      - name: Default runtime (x64 off)
        run: python -m pytest -q tests/test_x64_off.py
      - name: Per-recipe x64-off checks
        run: python -m pytest -q -k "x64_off or float32" tests/

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[gen,test,examples]"
          python -m pip install nbconvert ipykernel
      - name: Execute every notebook
        run: |
          set -e
          for nb in notebooks/0*.ipynb; do
            echo "== $nb"
            JAX_PLATFORMS=cpu timeout 1500 python -m nbconvert \
              --to notebook --execute --stdout "$nb" > /dev/null
          done
